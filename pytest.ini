[pytest]
testpaths = tests
pythonpath = .
addopts = -v --tb=short -ra
markers =
    integration: needs a live container (torch, Neo4j, the cohort); run outside the unit gate.
    slow: long-running test (multi-minute); opt in explicitly.
filterwarnings =
    ignore::DeprecationWarning
    ignore::neo4j.warnings.PreviewWarning

