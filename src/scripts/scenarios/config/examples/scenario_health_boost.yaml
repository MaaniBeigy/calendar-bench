scenario:
  id: health_boost_a
  description: >-
    Add 3–5 physical-activity and nutrition tasks to a working-age persona.
    Tasks drawn from Level 2–3 of the HealthTasks ontology.

  calendar:
    run_dir: ./output/example_experiment
    persona_environment: src/experiments/persona/example_experiment/environment.yaml
    persona_config:     src/experiments/persona/example_experiment/persona_config.yaml
    persona_events:     src/experiments/persona/example_experiment/event_config.yaml
    persona_rules:      src/experiments/persona/example_experiment/temporal_relation_rules.yaml

  task_generation:
    method: graphrag
    seed: 20260503
    num_tasks: 5
    ontologies:
      - HealthTasks
      - HumanActivities
    prompt_template: health_improvement
    filters:
      domains:
        - PhysicalActivityTask
        - NutritionTask
      difficulty:
        - Level2
        - Level3

  augmentation:
    method: greedy
    allow_merge: true
    merge_threshold: 0.70
    greedy:
      strategy: preference_first
      retry_on_miss: true
      max_backtrack: 3

  loss:
    # v4: 7 components — lambda_tt merged into lambda_cal; new lambda_divide.
    lambda_cov:    0.18
    lambda_cal:    0.18
    lambda_pref:   0.13
    lambda_disp:   0.18
    lambda_merge:  0.13
    lambda_spread: 0.10
    lambda_divide: 0.10

  output:
    dir: ./output/scenario_health_boost_a
    write_ics: true
    write_json: true
    write_report: true
