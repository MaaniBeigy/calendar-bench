# Project-level simulation environment.

seed: 20260503
horizon:
  start_date: 2026-05-04 # Monday
  weeks: 4
  enable_yearly_pass: true
  weekly_template: locked # locked | per_week
output:
  dir: ./output/persona_run/example_001
  per_person_json: true
  per_person_ics: true
  validation_report: true
solver:
  step_minutes: 10
  max_attempts: 25
  optimize_objective: maximize_sleep
time_windows:
  early_morning: [0, 400]
  morning: [400, 600]
  afternoon: [600, 960]
  evening: [960, 1260]
  night: [1260, 1440]
parallelism:
  workers: 0 # 0 = os.cpu_count()
  executor: process # process (default on GIL build) | thread
  chunk_size: 1
compute:
  device: auto # cpu | cuda | auto (auto probes for CUDA, falls back to cpu)
  cuda_device_index: 0 # which GPU when multiple are visible
