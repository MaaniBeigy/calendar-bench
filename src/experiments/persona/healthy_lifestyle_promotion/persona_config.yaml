      params: {loc: 0.68, scale: 0.15}
      clip: {min: 0, max: 1}
    conscientiousness:
      type: norm
      params: {loc: 0.32, scale: 0.14}
      clip: {min: 0, max: 1}
    extraversion:
      type: norm
      params: {loc: 0.70, scale: 0.14}
      clip: {min: 0, max: 1}
    agreeableness:
      type: norm
      params: {loc: 0.55, scale: 0.16}
      clip: {min: 0, max: 1}
    neuroticism:
      type: norm
      params: {loc: 0.45, scale: 0.16}
      clip: {min: 0, max: 1}
    weekly_workouts:
