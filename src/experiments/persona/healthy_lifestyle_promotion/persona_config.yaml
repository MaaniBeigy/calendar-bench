- id: free_spirited_social_student
    # Students and part-time workers aged about 21 ± 3 (18-29). 48% are women, 44%
    # men, and 8% non-binary; 3% have children. 50% are low income, 40% middle, and
    # 10% high, with pay around a median of €12,000/year and a long right tail. All
    # are students, and about 20% also hold a part-time job. They do about 1 workout a
    # week (Poisson, mean 1).
    # They eat breakfast around 08:00 for 15 minutes, 0-1 times/day, lunch around
    # 13:30 for 30 minutes, and dinner around 20:30 for 45 minutes. On weekdays they
    # study from 10:00 for 240-420 minutes/day across 2-3 episodes in the morning and
    # afternoon, and they read or study lightly 1-2 times/day for 120-240 minutes. The
    # ~20% with a part-time job work in the morning on Mon/Wed/Fri, once for 90-150
    # minutes. They cook around 19:30 for up to 20 minutes on weekdays. They
    # socialise in the afternoon and evening from Mon to Sun, 2-3 times/day for
    # 150-300 minutes, play video games at night 1-2 times/day for 90-180 minutes, and
    # go out around 22:00 on Saturday for 60-120 minutes. They clean their home on Sat
    # around 14:00 for 60 minutes, do laundry on Sun around 12:00 for 90 minutes, buy
    # groceries on Sat, and visit friends or family on Sun around 16:00. They take a
    # short walk in the evening on Mon/Wed/Fri, 0-2 times for 5-30 minutes. They take
    # a shower around 21:30 for 15 minutes and go to sleep from 23:30 for 5-7 hours.
    # They drink water, snack (0-6×/day), and nap ad libitum.
    # Among the Big Five personality traits, extraversion is high (0.70 ± 0.14) and
    # openness is high (0.68 ± 0.15); agreeableness and neuroticism are moderate (0.55
    # ± 0.16 and 0.45 ± 0.16) and conscientiousness is low (0.32 ± 0.14). The ~45%
    # above 0.70 in openness experience need_for_autonomy. The ~30% above 0.55
    # experience intention_not_to_enact_a_behaviour. No deliberate health planning is
    # modelled: this persona has no action_planning, intention_to_enact_a_behaviour,
    # or self_efficacy_belief_for_a_behaviour episodes.
    # They experience happy mood episodes 2-4×/day from morning to night for 60-240
    # minutes total, with ~30% more of their happy episodes placed in the afternoon
    # and evening. They experience calm episodes 1-2×/day in the evening and night for
    # 30-90 minutes total. They experience energetic episodes 3-4×/day from morning to
    # evening for 240-720 minutes total, and tired episodes 1-2×/day in the early
    # morning and morning for 30-120 minutes total. They experience hungry episodes
    # 1-8×/day at any time for 30-180 minutes total, and stress_episode 0-2×/day for
    # up to 90 minutes total.
    # They are home in the early morning, morning, evening, and night for 6-12
    # hours/day across 3-6 episodes, and at a public_park in the afternoon and evening
    # for 0-180 minutes across 1-2 episodes, with +1 episode on Sat/Sun. They are
    # with_family for 1-8 hours/day across 1-4 episodes and alone for 1-6 hours across
    # 1-3 episodes. The weather is suitable_for_outdoor in the morning, afternoon, or
    # evening for 0-6 hours across 0-3 episodes, or raining_or_snowing, any time
    # window, for 0-4 hours across 0-3 episodes.
    # They experience habitual_behaviour 1-2×/day in the evening (30-120 min). The
    # ~30% above 0.55 in neuroticism experience intention_not_to_enact_a_behaviour
    # 0-3×/day in the afternoon or evening (0-120 min). They experience
    # physical_behavioural_opportunity 3-4×/day from morning to evening (240-600 min),
    # social_behavioural_opportunity 3-4×/day in the afternoon and evening (240-540
    # min), and psychological_behavioural_capability 1-2×/day in the morning and
    # afternoon (60-240 min). The ~45% above 0.70 in openness experience
    # need_for_autonomy 0-3×/day from morning to evening (0-120 min). They experience
    # external_regulation 1-2×/day (0-3 hours) and intrinsic_motivation 0-2×/day (0-2
    # hours).
  instances: 10
  characteristics:
    occupation_status:
      type: categorical
      values: {fulltime: 0.0, parttime: 0.0, student: 1.0}
    gender:
      type: categorical
      values: {female: 0.48, male: 0.44, non_binary: 0.08}
    socioeconomic_status:
      type: categorical
      values: {low: 0.50, middle: 0.40, high: 0.10}
