common:
  default_jitter:
    time_minutes: 15
    duration_minutes: 5

personas:
- id: diligent_anxious_active
    # Full-time working adults aged about 40 ± 9 (22-65). 50% are women, 40% men, and
    # 10% non-binary; 30% have children. 50% are middle income, 30% low, and 20% high,
    # with pay around a median of €38,000/year and a long right tail. They aim for
    # about 3 workouts a week (Poisson, mean 3).
    # They eat breakfast around 07:00 for 15 minutes, lunch around 13:00 for 30
    # minutes, and dinner around 19:30 for 45 minutes. On weekdays they cycle to work
    # around 07:45 and back around 17:15, 15 minutes each way, and do office work from
    # 08:30 for 6-9 hours/day across 1-3 episodes. They attend 2-4 meetings in the
    # morning or afternoon for 150-360 minutes total. They cook around 17:30 for 30
    # minutes on Mon, Wed, and Sun. In the evening they do journaling around 21:00,
    # 0-1 times for 5-90 minutes (only the ~50% above 0.70 in conscientiousness), take
    # a shower around 21:30 for 15 minutes, read around 22:30 for 30 minutes, and go
    # to sleep from 22:30. Every day they walk in the morning, afternoon, or evening,
    # once for 20-60 minutes. On Tue/Thu they work out at the gym in the evening for
    # 60-240 minutes, duration rising 30 minutes by week 2, and run in the morning or
    # afternoon, 0-1 times for 20-45 minutes. On Saturday afternoon they swim for
    # 90-150 minutes. They clean their home on Saturday around 11:00 for 90 minutes,
    # do laundry on Sunday around 09:00 for 120 minutes, visit family or friends on
    # Saturday around 18:30 for 120 minutes, socialise on Saturday and Sunday
    # afternoon for 90-180 minutes, and go out on Friday around 21:00 for 45-120
    # minutes. They buy groceries on Wed/Sat, and drink water, snack, and nap ad
    # libitum.
    # Among the Big Five personality traits, conscientiousness is high (0.70 ± 0.05),
    # neuroticism is high (0.65 ± 0.18), and openness, extraversion, and agreeableness
    # are moderate (0.50 ± 0.18). The ~50% above 0.70 in conscientiousness experience
    # action_planning and self_efficacy_belief_for_a_behaviour; all do journaling and
    # experience intention_to_enact_a_behaviour. The ~60% above 0.60 in neuroticism
    # experience anxious episodes; the ~70% above 0.55 experience
    # intention_not_to_enact_a_behaviour and low_self_efficacy. The ~13% above 0.70 in
    # openness experience need_for_autonomy, and the same share above 0.70 in
    # agreeableness experience coping_planning.
    # They experience happy mood episodes up to 3×/day for 0.5-3 hours total, with
    # ~30% more of their happy episodes placed in the morning and afternoon. They
    # experience calm episodes 2-3×/day in the evening and night for 0.5-1.5 hours
    # total, +30 min on Sat/Sun. They experience anxious episodes up to 2×/day in the
    # morning or afternoon for up to 1.5 hours total. They experience energetic
    # episodes 3-4×/day from morning to evening for 4.5-12 hours total, with +1
    # episode on weekdays, and tired episodes 2×/night for 5-60 minutes total, +20 min
    # on Thu/Fri. They experience hungry episodes 1-10×/day at any time from early
    # morning to night for 0.5-3 hours total, and stress_episode up to 2×/day at any
    # time for up to 1.5 hours total.
    # They are home in the early morning, morning, evening, and night for 8-14
    # hours/day across 3-6 episodes, +60 min on Sat/Sun; at the workplace in the
    # morning and afternoon for 0-8 hours across 0-1 episodes, with +1 episode on
    # weekdays; and at a public_park, any time window, for 0-90 minutes across 0-1
    # episodes, with +1 episode on Sat/Sun. They are alone for 2-8 hours/day across
    # 1-3 episodes and with_family for 0-6 hours across 0-3 episodes. The weather is
    # suitable_for_outdoor in the morning, afternoon, or evening for 0-6 hours across
    # 0-3 episodes, or raining_or_snowing, any time window, for 0-4 hours across 0-3
    # episodes.
    # The ~50% above 0.70 in conscientiousness experience action_planning 0-2×/day in
    # the early morning (10-60 min total), intention_to_enact_a_behaviour 2-3×/day in
    # the morning (20-120 min), and self_efficacy_belief_for_a_behaviour 3×/day in the
    # evening (90-240 min). They experience habitual_behaviour 2-3×/day in the evening
    # (60-240 min). The ~70% above 0.55 in neuroticism experience
    # intention_not_to_enact_a_behaviour up to 2×/day in the afternoon or evening
    # (0-60 min) and low_self_efficacy up to 2×/day in the afternoon (0-90 min). They
    # experience physical_behavioural_opportunity 2-4×/day from morning to evening
    # (240-540 min), social_behavioural_opportunity 2-3×/day from morning to evening
    # (120-360 min), psychological_behavioural_capability 2-3×/day in the morning and
    # afternoon (120-300 min), and low_physical_opportunity_to_enact_a_behaviour up to
    # 2×/day at night (0-240 min). The ~13% above 0.70 in openness experience
    # need_for_autonomy up to 2×/day from morning to evening (0-90 min). They
    # experience intend_to_walk up to 2×/day in the early morning (0-60 min),
    # disposition_to_attend_to_one_s_goals up to 2×/day in the morning or afternoon
    # (0-60 min), intrinsic_motivation up to 3×/day (0-240 min), and
    # external_regulation up to 2×/day (0-180 min).
  instances: 10
  characteristics:
    occupation_status:
      type: categorical
      values: {fulltime: 1.0, parttime: 0.0, student: 0.0}
    gender:
      type: categorical
      values: {female: 0.50, male: 0.40, non_binary: 0.10}
    socioeconomic_status:
      type: categorical
      values: {low: 0.30, middle: 0.50, high: 0.20}
    has_kids:
      type: boolean
      p_true: 0.30
    has_part_time_job:
      type: boolean
      p_true: 0.0
    age:
      type: norm
      params: {loc: 40, scale: 9}
      clip: {min: 22, max: 65}
      dtype: int
    openness:
      type: norm
      params: {loc: 0.5, scale: 0.18}
      clip: {min: 0, max: 1}
    conscientiousness:
      type: norm
      params: {loc: 0.7, scale: 0.05}
      clip: {min: 0, max: 1}
    extraversion:
      type: norm
      params: {loc: 0.5, scale: 0.18}
      clip: {min: 0, max: 1}
    agreeableness:
      type: norm
      params: {loc: 0.5, scale: 0.18}
      clip: {min: 0, max: 1}
    neuroticism:
      type: norm
      params: {loc: 0.65, scale: 0.18}
      clip: {min: 0, max: 1}
    weekly_workouts:
      type: poisson
      params: {mu: 3}
    annual_income_eur:
      type: lognorm
      params: {s: 0.55, scale: 38000}
      dtype: int

  stages:
  - name: sleep
    time: "22:30"
    days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
    human_activity_iri: https://w3id.org/calendar-bench/human-activities/activity/sleeping
  - name: breakfast
    time: "07:00"
    duration_minutes: 15
    days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
    human_activity_iri: https://w3id.org/calendar-bench/human-activities/activity/eating-sitting
  - name: lunch
    time: "13:00"
    duration_minutes: 30
    days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
    human_activity_iri: https://w3id.org/calendar-bench/human-activities/activity/eating-sitting
  - name: dinner
    time: "19:30"
    duration_minutes: 45
    days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
    human_activity_iri: https://w3id.org/calendar-bench/human-activities/activity/eating-sitting
  - name: office_work
    time: "08:30"
    days: [Mon, Tue, Wed, Thu, Fri]
    human_activity_iri: https://w3id.org/calendar-bench/human-activities/activity/sitting-tasks-light-effort-e-g-office-work-chemistry-lab-work-light-assembly-repair-watch-repair-reading-desk-work
  - name: meeting
    time: "morning"
    duration_minutes: 120
    days: [Mon, Tue, Wed, Thu, Fri]
    human_activity_iri: https://w3id.org/calendar-bench/human-activities/activity/sitting-meetings-light-effort-general-and-or-with-talking-involved-e-g-eating-at-a-business-meeting
  - name: cycling
    time: "07:45"
    duration_minutes: 15
    days: [Mon, Tue, Wed, Thu, Fri]
    human_activity_iri: https://w3id.org/calendar-bench/human-activities/activity/bicycling-general
  - name: cycling
    time: "17:15"
    duration_minutes: 15
    days: [Mon, Tue, Wed, Thu, Fri]
    human_activity_iri: https://w3id.org/calendar-bench/human-activities/activity/bicycling-general
  - name: walking
    time: "evening"
    duration_minutes: 60
    days:
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    - Sun
    human_activity_iri: https://w3id.org/calendar-bench/human-activities/activity/walking-3-5-to-3-9-mph-level-brisk-firm-surface-walking-for-exercise
  - name: gym
    time: "evening"
    duration_minutes: 90
    days: [Tue, Thu]
    human_activity_iri: https://w3id.org/calendar-bench/human-activities/activity/circuit-training-body-weight-exercises
  - name: swimming
    time: "afternoon"
    duration_minutes: 60
    days: [Sat]
    human_activity_iri: https://w3id.org/calendar-bench/human-activities/activity/swimming-leisurely-not-lap-swimming-general
  - name: running
    time: "morning"
    duration_minutes: 30
    days: [Tue, Thu]
    human_activity_iri: https://w3id.org/calendar-bench/human-activities/activity/jogging-general-self-selected-pace
  - name: journaling
    time: "21:00"
    duration_minutes: 30
    days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
    human_activity_iri: https://w3id.org/calendar-bench/human-activities/activity/sitting-writing-desk-work-typing
  - name: reading
    time: "22:30"
    duration_minutes: 30
    days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
    human_activity_iri: https://w3id.org/calendar-bench/human-activities/activity/reclining-reading
  - name: cooking
    time: "17:30"
    duration_minutes: 30
    days: [Mon, Wed, Sun]
    human_activity_iri: https://w3id.org/calendar-bench/human-activities/activity/cooking-or-food-preparation-standing-or-sitting-or-in-general-not-broken-into-stand-walk-components-manual-appliances-light-effort
  - name: shower
    time: "21:30"
    duration_minutes: 15
    days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
    human_activity_iri: https://w3id.org/calendar-bench/human-activities/activity/showering-toweling-off-standing
  - name: laundry
    time: "09:00"
    duration_minutes: 120
    days: [Sun]
    human_activity_iri: https://w3id.org/calendar-bench/human-activities/activity/laundry-moderate-effort
  - name: cleaning
    time: "11:00"
    duration_minutes: 90
    days: [Sat]
    human_activity_iri: https://w3id.org/calendar-bench/human-activities/activity/cleaning-house-or-cabin-general-moderate-effort
  - name: visit_friends_or_family
    time: "18:30"
    duration_minutes: 120
    days: [Sat]
    human_activity_iri: https://w3id.org/calendar-bench/human-activities/activity/retreat-family-reunion-activities-involving-sitting-relaxing-talking-eating
  - name: going_out
    time: "21:00"
    days: [Fri]
    human_activity_iri: https://w3id.org/calendar-bench/human-activities/activity/standing-talking-in-person-on-the-phone-computer-text-messaging-writing
  - name: socialising
    time: "afternoon"
    days: [Sat, Sun]
    human_activity_iri: https://w3id.org/calendar-bench/human-activities/activity/sitting-talking-in-person-on-the-phone-computer-or-text-messaging-light-effort
      # Free-floating opt-ins: no time/duration, so the solver places them
      # flexibly (count and window come from the catalog).
  - name: drink_water
    days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
  - name: snacking
    days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
  - name: napping
    days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
  - name: groceries
    days: [Wed, Sat]

  event_overrides:
    office_work:
      per_event_duration: {min: 1, max: 9, unit: hours}
      total_event_duration: {scale: day, min: 6, max: 9, unit: hours}
      total_event_episodes: {scale: day, min: 1, max: 3}
    meeting:
      per_event_duration: {min: 5, max: 180, unit: minutes}
      total_event_duration: {scale: day, min: 150, max: 360, unit: minutes}
      total_event_episodes: {scale: day, min: 2, max: 4}
      temporal_patterns:
      - {mode: fix, details: {within: [morning, afternoon]}}
    walking:
      intensity: 2
      per_event_duration: {min: 20, max: 45, unit: minutes}
      total_event_duration: {scale: day, min: 20, max: 60, unit: minutes}
      total_event_episodes: {scale: day, min: 1, max: 1}
      temporal_patterns:
      - {mode: fix, details: {within: [morning, afternoon, evening]}}
    gym:
      intensity: 4
      per_event_duration: {min: 60, max: 240, unit: minutes}
      total_event_duration: {scale: day, min: 60, max: 240, unit: minutes}
      temporal_patterns:
      - {mode: fix, details: {within: [evening]}}
      - mode: seasonality
        details:
          target: duration
          unit: minutes
          within: [Sat]
          direction: increasing
          amount: 30
      - mode: trend
        details:
          target: duration
          unit: minutes
          scale: week
          direction: increasing
          amount: 30
          start: 1
          end: 2
    swimming:
      intensity: 3
      per_event_duration: {min: 90, max: 150, unit: minutes}
      total_event_duration: {scale: day, min: 90, max: 150, unit: minutes}
      total_event_episodes: {scale: day, min: 1, max: 1}
    running:
      intensity: 3
      per_event_duration: {min: 20, max: 45, unit: minutes}
      total_event_duration: {scale: day, min: 0, max: 45, unit: minutes}
      total_event_episodes: {scale: day, min: 0, max: 1}
      temporal_patterns:
      - {mode: fix, details: {within: [morning, afternoon]}}
    journaling:
      per_event_duration: {min: 5, max: 90, unit: minutes}
      total_event_duration: {scale: day, min: 5, max: 90, unit: minutes}
      total_event_episodes: {scale: day, min: 0, max: 1}
    snacking:
      per_event_duration: {min: 5, max: 15, unit: minutes}
      total_event_duration: {scale: day, min: 5, max: 60, unit: minutes}
      total_event_episodes: {scale: day, min: 1, max: 3}
    going_out:
      per_event_duration: {min: 45, max: 120, unit: minutes}
      total_event_duration: {scale: week, min: 0, max: 120, unit: minutes}
      total_event_episodes: {scale: week, min: 0, max: 1}
      temporal_patterns:
      - {mode: fix, details: {within: [evening, night]}}
    socialising:
      per_event_duration: {min: 60, max: 150, unit: minutes}
      total_event_duration: {scale: day, min: 90, max: 180, unit: minutes}
      total_event_episodes: {scale: day, min: 1, max: 2}
      temporal_patterns:
      - {mode: fix, details: {within: [afternoon]}}
  contexts:
    mood_emotion:
      mutually_exclusive: true
      members:
        happy:
          per_event_duration: {min: 5, max: 90, unit: minutes}
          total_event_duration: {scale: day, min: 30, max: 180, unit: minutes}
          total_event_episodes: {scale: day, min: 0, max: 3}
          ontology_uri: http://purl.obolibrary.org/obo/MFOEM_000042
          temporal_patterns:
          - mode: seasonality
            details: {target: episodes, unit: percent, within: [morning, afternoon], amount: 30, direction: increasing}
        calm:
          per_event_duration: {min: 5, max: 45, unit: minutes}
          total_event_duration: {scale: day, min: 30, max: 90, unit: minutes}
          total_event_episodes: {scale: day, min: 2, max: 3}
          ontology_uri: http://purl.obolibrary.org/obo/MFOEM_000107
          temporal_patterns:
          - {mode: fix, details: {within: [evening, night]}}
          - mode: seasonality
            details:
              target: duration
              unit: minutes
              within: [Sat, Sun]
              direction: increasing
              amount: 30
        anxious:
          per_event_duration: {min: 5, max: 60, unit: minutes}
          total_event_duration: {scale: day, min: 0, max: 90, unit: minutes}
          total_event_episodes: {scale: day, min: 0, max: 2}
          ontology_uri: http://purl.obolibrary.org/obo/MFOEM_000028
          requires:
            neuroticism: {ge: 0.6}
          temporal_patterns:
          - {mode: fix, details: {within: [morning, afternoon]}}

    energy_state:
      mutually_exclusive: true
      members:
        energetic:
          per_event_duration: {min: 120, max: 180, unit: minutes}
          total_event_duration: {scale: day, min: 270, max: 720, unit: minutes}
          total_event_episodes: {scale: day, min: 3, max: 4}
          ontology_uri: http://purl.obolibrary.org/obo/MFOEM_000109
          temporal_patterns:
          - {mode: fix, details: {within: [morning, afternoon, evening]}}
          - mode: seasonality
            details:
              target: episodes
              unit: count
              scale: weekday
              within: [Mon, Tue, Wed, Thu, Fri]
              direction: increasing
              amount: 1
        tired:
          per_event_duration: {min: 5, max: 30, unit: minutes}
          total_event_duration: {scale: day, min: 5, max: 60, unit: minutes}
          total_event_episodes: {scale: day, min: 2, max: 2}
          ontology_uri: http://purl.obolibrary.org/obo/MFOEM_000080
          temporal_patterns:
          - {mode: fix, details: {within: [night]}}
          - mode: seasonality
            details:
              target: duration
              unit: minutes
              scale: weekday
              within: [Thu, Fri]
              direction: increasing
              amount: 20

    physiological:
      members:
        hungry:
          per_event_duration: {min: 15, max: 60, unit: minutes}
          total_event_duration: {scale: day, min: 30, max: 180, unit: minutes}
          total_event_episodes: {scale: day, min: 1, max: 10}
          ontology_uri: http://purl.obolibrary.org/obo/MFOEM_000205
          temporal_patterns:
          - {mode: fix, details: {within: [early_morning, morning, afternoon, evening, night]}}

    stress:
      members:
        stress_episode:
          per_event_duration: {min: 10, max: 45, unit: minutes}
          total_event_duration: {scale: day, min: 0, max: 90, unit: minutes}
          total_event_episodes: {scale: day, min: 0, max: 2}
          ontology_uri: http://www.ebi.ac.uk/efo/EFO_0005230

    location:
      mutually_exclusive: true
      members:
        home:
          per_event_duration: {min: 60, max: 480, unit: minutes}
          total_event_duration: {scale: day, min: 8, max: 14, unit: hours}
          total_event_episodes: {scale: day, min: 3, max: 6}
          ontology_uri: https://github.com/EBehaviourChange-COPPER/ontology/blob/main/COPPER_2014
          temporal_patterns:
          - {mode: fix, details: {within: [early_morning, morning, evening, night]}}
          - mode: seasonality
            details:
              target: duration
              unit: minutes
              scale: weekday
              within: [Sat, Sun]
              direction: increasing
              amount: 60
        workplace:
          per_event_duration: {min: 60, max: 480, unit: minutes}
          total_event_duration: {scale: day, min: 0, max: 8, unit: hours}
          total_event_episodes: {scale: day, min: 0, max: 1}
          ontology_uri: http://purl.obolibrary.org/obo/OMRSE_00000078
          temporal_patterns:
          - {mode: fix, details: {within: [morning, afternoon]}}
          - mode: seasonality
            details:
              target: episodes
              unit: count
              scale: weekday
              within: [Mon, Tue, Wed, Thu, Fri]
              direction: increasing
              amount: 1
        public_park:
          per_event_duration: {min: 30, max: 90, unit: minutes}
          total_event_duration: {scale: day, min: 0, max: 90, unit: minutes}
          total_event_episodes: {scale: day, min: 0, max: 1}
          ontology_uri: http://purl.obolibrary.org/obo/ENVO_03500002
          temporal_patterns:
          - mode: seasonality
            details:
              target: episodes
              unit: count
              scale: weekday
              within: [Sat, Sun]
              direction: increasing
              amount: 1

    social_context:
      mutually_exclusive: true
      members:
        alone:
          per_event_duration: {min: 60, max: 360, unit: minutes}
          total_event_duration: {scale: day, min: 2, max: 8, unit: hours}
          total_event_episodes: {scale: day, min: 1, max: 3}
          ontology_uri: https://github.com/EBehaviourChange-COPPER/ontology/blob/main/COPPER_2004
        with_family:
          per_event_duration: {min: 30, max: 240, unit: minutes}
          total_event_duration: {scale: day, min: 0, max: 6, unit: hours}
          total_event_episodes: {scale: day, min: 0, max: 3}
          ontology_uri: http://humanbehaviourchange.org/ontology/BCIO_006002

    weather_environment:
      mutually_exclusive: true
      members:
        suitable_for_outdoor:
          per_event_duration: {min: 60, max: 360, unit: minutes}
          total_event_duration: {scale: day, min: 0, max: 6, unit: hours}
          total_event_episodes: {scale: day, min: 0, max: 3}
          ontology_uri: https://github.com/EBehaviourChange-COPPER/ontology/blob/main/COPPER_3019
          temporal_patterns:
          - {mode: fix, details: {within: [morning, afternoon, evening]}}
        raining_or_snowing:
          per_event_duration: {min: 30, max: 240, unit: minutes}
          total_event_duration: {scale: day, min: 0, max: 4, unit: hours}
          total_event_episodes: {scale: day, min: 0, max: 3}
          ontology_uri: https://github.com/EBehaviourChange-COPPER/ontology/blob/main/COPPER_3127

      # -------- Behaviour-change theory layers  ---------
    behaviour_state:
      members:
        action_planning:
          per_event_duration: {min: 5, max: 30, unit: minutes}
          total_event_duration: {scale: day, min: 10, max: 60, unit: minutes}
          total_event_episodes: {scale: day, min: 0, max: 2}
          ontology_uri: http://humanbehaviourchange.org/ontology/BCIO_050844
          theory_mappings:
            tdf_domain: [Goals, Behavioural regulation]
            comb: reflective_motivation
            hapa: action_planning
          requires:
            conscientiousness: {ge: 0.70}
          temporal_patterns:
          - {mode: fix, details: {within: [early_morning]}}
          # Morning window so running sessions (Tue/Thu) can overlap
          # the intention episode under the shape (2) co-occurrence
          # rule `F (running AND intention_to_enact_a_behaviour)`.
        intention_to_enact_a_behaviour:
          per_event_duration: {min: 10, max: 45, unit: minutes}
          total_event_duration: {scale: day, min: 20, max: 120, unit: minutes}
          total_event_episodes: {scale: day, min: 2, max: 3}
          ontology_uri: https://w3id.org/calendar-bench/context#behaviour_state/IntentionToEnactABehaviour
          theory_mappings:
            tdf_domain: [Goals]
            comb: reflective_motivation
            hapa: motivational_intention
          temporal_patterns:
          - {mode: fix, details: {within: [morning]}}
          # Avoidance episode (e.g. user skipping gym today); occurs
          # later in the day when fatigue or neuroticism takes over.
        intention_not_to_enact_a_behaviour:
          per_event_duration: {min: 10, max: 45, unit: minutes}
          total_event_duration: {scale: day, min: 0, max: 60, unit: minutes}
          total_event_episodes: {scale: day, min: 0, max: 2}
          ontology_uri: https://w3id.org/calendar-bench/context#behaviour_state/IntentionNotToEnactABehaviour
          requires:
            neuroticism: {ge: 0.55}
          temporal_patterns:
          - {mode: fix, details: {within: [afternoon, evening]}}
          # Evening routine block. No `requires` so every person has
          # at least one habit episode occurring; this keeps the
          # `F (gym AND context:habitual_behaviour)` rule reachable
          # for every person.
        habitual_behaviour:
          per_event_duration: {min: 30, max: 90, unit: minutes}
          total_event_duration: {scale: day, min: 60, max: 240, unit: minutes}
          total_event_episodes: {scale: day, min: 2, max: 3}
          ontology_uri: http://humanbehaviourchange.org/ontology/BCIO_006158
          temporal_patterns:
          - {mode: fix, details: {within: [evening]}}
          # Evening window saturated by 5 medium-length episodes so
          # every gym session overlaps at least one belief episode.
          # behaviour_state is not mutually-exclusive so episodes are
          # free to share minutes; the random placer reliably covers
          # the gym slot when episodes pile up.
        self_efficacy_belief_for_a_behaviour:
          per_event_duration: {min: 60, max: 120, unit: minutes}
          total_event_duration: {scale: day, min: 90, max: 240, unit: minutes}
          total_event_episodes: {scale: day, min: 3, max: 3}
          ontology_uri: http://humanbehaviourchange.org/ontology/BCIO_006154
          requires:
            conscientiousness: {ge: 0.70}
          temporal_patterns:
          - {mode: fix, details: {within: [evening]}}
          # Coping planning occurs after stress hits; afternoon/evening.
        coping_planning:
          per_event_duration: {min: 5, max: 20, unit: minutes}
          total_event_duration: {scale: day, min: 0, max: 40, unit: minutes}
          total_event_episodes: {scale: day, min: 0, max: 2}
          ontology_uri: http://humanbehaviourchange.org/ontology/BCIO_050624
          requires:
            agreeableness: {ge: 0.70}
          temporal_patterns:
          - {mode: fix, details: {within: [afternoon, evening]}}

    capability_opportunity:
      members:
          # Daytime opportunity window saturated by 6 longer episodes
          # so the morning walking event and any daytime activity
          # overlap at least one opportunity slot.
        physical_behavioural_opportunity:
          per_event_duration: {min: 120, max: 180, unit: minutes}
          total_event_duration: {scale: day, min: 240, max: 540, unit: minutes}
          total_event_episodes: {scale: day, min: 2, max: 4}
          ontology_uri: http://humanbehaviourchange.org/ontology/BCIO_006089
          theory_mappings:
            tdf_domain: [Environmental context and resources]
            comb: physical_opportunity
          temporal_patterns:
          - {mode: fix, details: {within: [morning, afternoon, evening]}}
          # Daytime social opportunity with broad coverage so meetings
          # (morning) and any other daytime social event have at least
          # one overlap somewhere in the horizon.
        social_behavioural_opportunity:
          per_event_duration: {min: 60, max: 180, unit: minutes}
          total_event_duration: {scale: day, min: 120, max: 360, unit: minutes}
          total_event_episodes: {scale: day, min: 2, max: 3}
          ontology_uri: http://humanbehaviourchange.org/ontology/BCIO_006090
          theory_mappings:
            tdf_domain: [Social influences]
            comb: social_opportunity
          temporal_patterns:
          - {mode: fix, details: {within: [morning, afternoon, evening]}}
          # Workday focus block saturated by 4 episodes spanning
          # morning + afternoon so every office_work session overlaps
          # at least one capability slot.
        psychological_behavioural_capability:
          per_event_duration: {min: 60, max: 120, unit: minutes}
          total_event_duration: {scale: day, min: 120, max: 300, unit: minutes}
          total_event_episodes: {scale: day, min: 2, max: 3}
          ontology_uri: http://humanbehaviourchange.org/ontology/BCIO_050325
          theory_mappings:
            tdf_domain: [Memory attention and decision processes]
            comb: psychological_capability
          temporal_patterns:
          - {mode: fix, details: {within: [morning, afternoon]}}
          # Constraint window: weather, transport, or location blocks
          # the physical opportunity. Occurs after daylight, when the
          # opposite member is no longer active.
        low_physical_opportunity_to_enact_a_behaviour:
          per_event_duration: {min: 30, max: 240, unit: minutes}
          total_event_duration: {scale: day, min: 0, max: 4, unit: hours}
          total_event_episodes: {scale: day, min: 0, max: 2}
          ontology_uri: http://humanbehaviourchange.org/ontology/BCIO_050700
          temporal_patterns:
          - {mode: fix, details: {within: [night]}}
          # Late-workday energy slump for high-neuroticism persons;
          # afternoon window avoids the night `self_efficacy` block so
          # the bipolar non-overlap LTL rule passes.
        low_self_efficacy:
          per_event_duration: {min: 15, max: 45, unit: minutes}
          total_event_duration: {scale: day, min: 0, max: 90, unit: minutes}
          total_event_episodes: {scale: day, min: 0, max: 2}
          ontology_uri: http://humanbehaviourchange.org/ontology/BCIO_050701
          requires:
            neuroticism: {ge: 0.55}
          temporal_patterns:
          - {mode: fix, details: {within: [afternoon]}}
          # Self-directed choice window; supports intrinsic_motivation.
        need_for_autonomy:
          per_event_duration: {min: 15, max: 60, unit: minutes}
          total_event_duration: {scale: day, min: 0, max: 90, unit: minutes}
          total_event_episodes: {scale: day, min: 0, max: 2}
          ontology_uri: http://humanbehaviourchange.org/ontology/BCIO_006065
          requires:
            openness: {ge: 0.70}
          temporal_patterns:
          - {mode: fix, details: {within: [morning, afternoon, evening]}}

      # ---- Goals / motivation (visible only to the evaluator) ----
    goal_intention:
      members:
          # Intent to walk occurs in the morning before the walk event.
          # Occurs before the morning walking window so walking always
          # follows.
        intend_to_walk:
          per_event_duration: {min: 5, max: 30, unit: minutes}
          total_event_duration: {scale: day, min: 0, max: 60, unit: minutes}
          total_event_episodes: {scale: day, min: 0, max: 2}
          ontology_uri: http://humanbehaviourchange.org/ontology/BCIO_050683
          temporal_patterns:
          - {mode: fix, details: {within: [early_morning]}}
        disposition_to_attend_to_one_s_goals:
          per_event_duration: {min: 5, max: 30, unit: minutes}
          total_event_duration: {scale: day, min: 0, max: 60, unit: minutes}
          total_event_episodes: {scale: day, min: 0, max: 2}
          ontology_uri: http://humanbehaviourchange.org/ontology/BCIO_050630
          temporal_patterns:
          - {mode: fix, details: {within: [morning, afternoon]}}

    sdt_regulation:
      mutually_exclusive: true
      members:
        intrinsic_motivation:
          ontology_uri: http://humanbehaviourchange.org/ontology/BCIO_006136
          per_event_duration: {min: 15, max: 120, unit: minutes}
          total_event_duration: {scale: day, min: 0, max: 4, unit: hours}
          total_event_episodes: {scale: day, min: 0, max: 3}
        external_regulation:
          ontology_uri: http://humanbehaviourchange.org/ontology/BCIO_006086
          per_event_duration: {min: 15, max: 120, unit: minutes}
          total_event_duration: {scale: day, min: 0, max: 3, unit: hours}
          total_event_episodes: {scale: day, min: 0, max: 2}

- id: unemployed_family_caregiver
    # Unemployed and part-time family caregivers aged about 46 ± 8 (30-62). 48% are
    # women, 44% men, and 8% non-binary; 60% have children. 60% are low income, 35%
    # middle, and 5% high, with income around a median of €22,000/year and a
    # long right tail. 90% are unemployed and 10% work part time. They do about 1
    # workout a week (Poisson, mean 1).
    # They eat breakfast around 06:30 for 15 minutes, lunch around 12:30 for 20
    # minutes, and dinner around 18:00 for 40 minutes. The 60% with children provide
    # childcare 3-5 times/day for 330-540 minutes total across the early morning,
    # morning, afternoon, and evening; the other 40% instead care for an elderly or
    # disabled adult 2-4 times/day for 300-480 minutes across the same windows. On
    # weekdays the part-time share does office work from 09:00 for 1-6 hours/day
    # across 1-2 episodes. They cook 2-3 times/day from Mon to Sun for 120-240 minutes
    # total, clean their home daily 1-2 times for 90-180 minutes, do laundry on Thu
    # and Sun around 09:00 for 120 minutes, and buy groceries on Mon/Wed/Fri/Sat. They
    # take a short walk in the morning on Mon/Wed/Sat, 0-1 times for 30-60 minutes.
    # They take a shower around 21:30 for 15 minutes, read around 22:30 for 30
    # minutes, and go to sleep from 23:00. They drink water, snack (1-4×/day), and nap
    # ad libitum.
    # Among the Big Five personality traits, neuroticism is high (0.62 ± 0.16) and
    # agreeableness is high (0.68 ± 0.15); conscientiousness and extraversion are
    # moderate (0.45 ± 0.15) and openness is low (0.40 ± 0.15). The ~66% above 0.55
    # experience intention_not_to_enact_a_behaviour and low_self_efficacy. The ~45%
    # above 0.70 in agreeableness experience coping_planning. No deliberate health
    # planning is modelled: this persona has no action_planning,
    # intention_to_enact_a_behaviour, or self_efficacy_belief_for_a_behaviour
    # episodes.
    # They experience happy mood episodes 0-2×/day for 15-90 minutes total, with ~20%
    # more of their happy episodes placed in the afternoon and evening. They
    # experience calm episodes 1-2×/day in the evening and night for 20-60 minutes
    # total. They experience energetic episodes 1-2×/day in the morning and afternoon
    # for 60-240 minutes total, and tired episodes 3-4×/day in the afternoon, evening,
    # and night for 60-240 minutes total, +30 minutes on Thu/Fri/Sat. They experience
    # hungry episodes 1-8×/day at any time for 30-150 minutes total, and
    # stress_episode 1-3×/day in the morning, afternoon, or evening for 30-180 minutes
    # total.
    # They are home in the early morning, morning, afternoon, evening, and night for
    # 10-16 hours/day across 3-6 episodes, +60 minutes on Sat/Sun; the part-time share
    # is at the workplace in the morning and afternoon for 0-5 hours across 0-1
    # episodes, with +1 episode on weekdays; and at a public_park in the afternoon for
    # 0-60 minutes across 0-1 episodes. They are with_family for 2-10 hours/day across
    # 1-4 episodes and alone for 1-5 hours across 1-2 episodes. The weather is
    # suitable_for_outdoor in the morning, afternoon, or evening for 0-6 hours across
    # 0-3 episodes, or raining_or_snowing, any time window, for 0-4 hours across 0-3
    # episodes.
    # They experience habitual_behaviour 2-4×/day in the early morning, morning, and
    # evening (60-300 min). The ~66% above 0.55 in neuroticism experience
    # intention_not_to_enact_a_behaviour 0-3×/day in the afternoon or evening (0-120
    # min) and low_self_efficacy 0-3×/day in the afternoon or evening (0-120 min). The
    # ~45% above 0.70 in agreeableness experience coping_planning 0-2×/day in the
    # afternoon or evening (0-60 min). They experience
    # physical_behavioural_opportunity 2-3×/day from morning to evening (120-360 min),
    # social_behavioural_opportunity 1-2×/day (60-240 min),
    # psychological_behavioural_capability 1-2×/day in the morning and afternoon
    # (60-240 min), and low_physical_opportunity_to_enact_a_behaviour 2-4×/day in the
    # evening and night (2-4 hours). They experience external_regulation 1-3×/day (0-4
    # hours) and intrinsic_motivation 0-1×/day (0-1 hour).
  instances: 10
  characteristics:
    occupation_status:
      type: categorical
      values: {fulltime: 0.0, parttime: 0.10, unemployed: 0.90}
    gender:
      type: categorical
      values: {female: 0.48, male: 0.44, non_binary: 0.08}
    socioeconomic_status:
      type: categorical
      values: {low: 0.60, middle: 0.35, high: 0.05}
    has_kids:
      type: boolean
      p_true: 0.60
    has_part_time_job:
      type: boolean
      p_true: 0.0
    age:
      type: norm
      params: {loc: 46, scale: 8}
      clip: {min: 30, max: 62}
      dtype: int
    openness:
      type: norm
      params: {loc: 0.40, scale: 0.15}
      clip: {min: 0, max: 1}
    conscientiousness:
      type: norm
      params: {loc: 0.45, scale: 0.15}
      clip: {min: 0, max: 1}
    extraversion:
      type: norm
      params: {loc: 0.45, scale: 0.15}
      clip: {min: 0, max: 1}
    agreeableness:
      type: norm
      params: {loc: 0.68, scale: 0.15}
      clip: {min: 0, max: 1}
    neuroticism:
      type: norm
      params: {loc: 0.62, scale: 0.16}
      clip: {min: 0, max: 1}
    weekly_workouts:
      type: poisson
      params: {mu: 1}
    annual_income_eur:
      type: lognorm
      params: {s: 0.50, scale: 22000}
      dtype: int

