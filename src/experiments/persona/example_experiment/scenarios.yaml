# Example benchmark scenarios (CoopIS 2026).

experiment_id: example_experiment
run_dir: ./output/example_experiment
output_base: ./output

scenarios:
  - id: blind_oneshot_gpt_4o_mini
    label: Context Blind One-Shot (gpt-4o-mini)
    description: >-
      Baseline. Every stage pinned to gpt-4o-mini; augmenter sees no
      context episodes.
    task_generation: &shared_task_generation
      method: graphrag_grounded
      seed: 20260601
      num_tasks: 20
      ontologies:
        - HealthTasks
        - HumanActivities
      prompt_template: health_improvement
      filters:
        domains:
          - PhysicalActivityTask
          - MentalWellbeingTask
        difficulty:
          - Level2
          - Level3
      max_fetch_retries: 3
      paraphrase: true
      paraphrase_similarity_threshold: 0.80
      paraphrase_max_length_delta_pct: 0.20
      fetch_top_k: 40
    task_generator_model: &task_generator_model_4o_mini
      provider: openai
      model: gpt-4o-mini
      max_retries: 1
    evaluation: &shared_evaluation
      buffer_minutes: 30
      merge_threshold: 0.70
      disp_half_life_days: 2.0
      divide_duration_tolerance_pct: 0.15
    evaluator_model: &evaluator_model_4o_mini
      provider: openai
      model: gpt-4o-mini
      max_retries: 1
    augmentation:
      - method: llm_agent
        allow_merge: true
        merge_threshold: 0.70
        repeat_per_week: true
        observation:
          contexts: []
          host_flags: []
          task_flags:
            &task_flags_full [
              concurrent_ok,
              dividable_ok,
              duration_min,
              duration_max,
              intensity,
              context_recommends,
            ]
        llm_agent: &augmenter_4o_mini
          provider: openai
          model: gpt-4o-mini
          max_retries: 1
          prompt_template: augment_oneshot
        loss: &shared_loss
          lambda_cov: 0.16
          lambda_cal: 0.16
          lambda_pref: 0.12
          lambda_disp: 0.16
          lambda_merge: 0.12
          lambda_spread: 0.10
          lambda_divide: 0.08
          lambda_context_fit: 0.10

  - id: informed_oneshot_gpt_4o_mini
    label: Context Aware One-Shot (gpt-4o-mini)
    description: >-
      Information-budget A/B against the blind baseline; augmenter reads
      behaviour_state and capability_opportunity episodes only.
    task_generation: *shared_task_generation
    task_generator_model: *task_generator_model_4o_mini
    evaluation: *shared_evaluation
    evaluator_model: *evaluator_model_4o_mini
    augmentation:
      - method: llm_agent
        allow_merge: true
        merge_threshold: 0.70
        repeat_per_week: true
        observation:
          contexts:
            [
              weather_environment,
              behaviour_state,
              capability_opportunity,
              goal_intention,
              sdt_regulation,
            ]
          context_detail: summary
          task_flags: *task_flags_full
        llm_agent: *augmenter_4o_mini
        loss: *shared_loss

